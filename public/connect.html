<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk to Imperial</title>
<link rel="icon" href="/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f5fd1;--blue-700:#123c8a;--ink:#0f1b2d;--ink2:#334155;--muted:#6b7a90;--line:#e7ecf3;--bg:#f6f8fb}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:radial-gradient(700px 360px at 90% -10%,rgba(31,95,209,.14),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -30px rgba(15,27,45,.25);overflow:hidden}
.top{padding:26px 28px;color:#fff;background:linear-gradient(120deg,var(--blue-700),var(--blue) 60%,#3b82f6)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:12px;background:#fff;padding:5px}
.brand b{font-size:16px}.brand small{display:block;opacity:.8;font-size:12px}
.top h1{margin:18px 0 4px;font-size:22px;letter-spacing:-.02em}
.top p{margin:0;opacity:.85;font-size:14px}
form{padding:24px 28px 28px;display:grid;gap:14px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice label{border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;cursor:pointer}
.choice input{accent-color:var(--blue)}
.choice label:has(input:checked){border-color:var(--blue);background:#f0f5fe;color:var(--blue-700)}
.f{display:grid;gap:6px;font-size:12.5px;font-weight:650;color:var(--ink2)}
.f input,.f textarea{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink)}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,95,209,.12)}
button{font:700 14px Manrope,sans-serif;height:46px;border:0;border-radius:12px;color:#fff;background:linear-gradient(180deg,#2a6be0,var(--blue));cursor:pointer;box-shadow:0 8px 18px -8px rgba(31,95,209,.6)}
button:disabled{opacity:.6}
.err{color:#c13434;font-size:13px;min-height:1em;margin:0}
.done{padding:34px 28px;text-align:center}
.done h2{margin:12px 0 6px;font-size:20px}.done p{margin:0;color:var(--muted)}
.tick{width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#eefaf3;color:#15814f;font-size:26px;font-weight:800}
.small{font-size:12px;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top"><div class="brand"><img src="/logo.webp" alt=""><div><b id="co">Imperial Group</b><small>Halol, Gujarat</small></div></div>
    <h1>Talk to our team</h1><p id="sub">Leave your number and we will get back to you.</p></div>
  <form id="f">
    <div class="choice">
      <label><input type="radio" name="a" value="call" checked> Call me back</label>
      <label id="waopt"><input type="radio" name="a" value="wa"> WhatsApp us</label>
    </div>
    <label class="f">Your name<input id="n" autocomplete="name" required></label>
    <label class="f">Phone or WhatsApp number<input id="p" type="tel" autocomplete="tel" required></label>
    <label class="f">Best time to reach you<input id="t" placeholder="e.g. today after 3 pm"></label>
    <label class="f">Anything we should know (optional)<textarea id="m" rows="2"></textarea></label>
    <p class="err" id="e" role="alert"></p>
    <button id="b" type="submit">Request a call back</button>
    <p class="small">We only use these details to contact you about your inquiry.</p>
  </form>
</div>
<script>
const token = location.pathname.split('/').pop(), $ = id => document.getElementById(id);
const pre = new URLSearchParams(location.search).get('a');
fetch('/api/connect/' + token).then(r => r.ok ? r.json() : Promise.reject(r)).then(d => {
  $('co').textContent = d.company; $('sub').textContent = `About your inquiry, ${d.client}. Leave your number and we will get back to you.`;
  if (d.person) $('n').value = d.person;
  if (!d.wa) $('waopt').hidden = true;
  if (pre === 'wa' && d.wa) document.querySelector('input[value=wa]').checked = true;
  label();
}).catch(() => { $('card').innerHTML = '<div class="done"><h2>This link is no longer valid</h2><p>Please reply to our mail and we will get in touch.</p></div>'; });
const label = () => { $('b').textContent = document.querySelector('input[name=a]:checked').value === 'wa' ? 'Continue to WhatsApp' : 'Request a call back'; };
document.querySelectorAll('input[name=a]').forEach(r => r.onchange = label);
$('f').onsubmit = async e => {
  e.preventDefault(); $('e').textContent = ''; $('b').disabled = true;
  const action = document.querySelector('input[name=a]:checked').value;
  try {
    const r = await fetch('/api/connect/' + token, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, name: $('n').value, phone: $('p').value, time: $('t').value, note: $('m').value }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Something went wrong');
    if (d.wa) { location.href = d.wa; return; }
    $('card').innerHTML = '<div class="done"><div class="tick">✓</div><h2>Thank you</h2><p>Our team has your details and will call you back soon.</p></div>';
  } catch (err) { $('e').textContent = err.message; $('b').disabled = false; }
};
</script>
</body>
</html>
